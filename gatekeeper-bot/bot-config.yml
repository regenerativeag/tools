########################################################################################################################
# This is the real configuration file used for the regenerative agriculture discord server.
#
# You can copy this config and edit it to create your own configuration file for your server.
#
# Every time you edit your config, you should restart the gatekeeper bot application so the new config gets read.
########################################################################################################################



# Your discord server id
guildId: 1162017936656044042 # Regenerative Agriculture



# All the member ids that should not be granted membership roles.
#
#   Not all members should be granted roles when they post.
#
#   For example, you may not want to give your bot a role when it posts.
excludedUserIds:
  - 1282462880532402206 # Gatekeeper Bot
  - 1221517195931156530 # Larry (Active Member Bot)
  - 302050872383242240  # Disboard
  - 476259371912003597  # Discord.me
  - 155149108183695360  # Dyno
  - 204255221017214977  # YAGPDB.xyz



# The rules for how users are granted membership roles in your server...
#
#   This is an ordered list.
#     - Roles at the top of this list have the lowest priority.
#     - If you define your rules such that a user can qualify for multiple roles at once, only the role with the highest priority (lowest in this list) will be granted to the user.
#     - When a role with a greater priority (lower in this list) is granted to a member, a "welcome message" is posted to a room.
#     - When a member is transitioned to a membership role with a lower priority, a "downgrade message" is posted to a
#     room.
#
#   There may be multiple ways a user can be granted a given role (aka paths). Each path to a role is defined through rules that you define.
#
# The null ruleId corresponds to a user without any membership roles.
roleConfigs:

  # Inactive
  - roleId: 1322321679006961664
    paths:
      # The user is a Visitor, has made no posts or reactions in the last 7 days, and they joined some time before 7 days ago
      - daysToConsider: 7
        rule:
          type: and
          rules:
            - type: has_role
              roleId: null # Visitor
            - type: no_posts_or_reactions
            - type: joined_before
      # The user is a Guest, and has made no posts or reactions in the last 14 days
      - daysToConsider: 14
        rule:
          type: and
          rules:
            - type: has_role
              roleId: 1240396803946582056 # Guest
            - type: no_posts_or_reactions
      # The user is an Inactive Member, and has made no posts or reactions in the last 365 days
      - daysToConsider: 365
        rule:
          type: and
          rules:
            - type: has_role
              roleId: 1322321901586087976 # Inactive member
            - type: no_posts_or_reactions

  # Inactive Member
  - roleId: 1322321901586087976
    paths:
      # The user is a Member, and has made no posts or reactions in the last 60 days
      - daysToConsider: 60
        rule:
          type: and
          rules:
            - type: has_role
              roleId: 1322322020284760196 # Member
            - type: no_posts_or_reactions

  # Visitor (no role)
  # Note: You _must_ have a config defined with roleId=null. This is the config that will be used for users that have no membership roles.
  - roleId: null
    paths:
      # The user has the "Inactive" role, and reacts with a 👍 in #quiet-garden
      - daysToConsider: 0 # no post or reaction history used, only current state
        rule:
          type: and
          rules:
            - type: has_role
              roleId: 1322321679006961664 # Inactive
            - type: reacted
              emoji: "👍"
              messageId: 1322322546296885341 # message in quiet garden

  # Guest
  - roleId: 1240396803946582056
    paths:
      # The user is a Visitor, and has at least 1 post in the last 14 days
      - daysToConsider: 14
        rule:
          type: and
          rules:
            - type: has_role
              roleId: null # no active role, aka visitor
            - type: post_days
              atLeast: 1
        welcomeMessageConfig:
          channel: 1162017937796911209 # connect
          template: "A warm hello to our newest guest, USER_MENTION :relaxed: Please check out our [Community Guide](https://regenagcoop.org/community-guide/) when you have a moment."

  # Member
  - roleId: 1322322020284760196
    paths:
      # The user is a Guest, and has made at least 4 posts in the last 60 days
      - daysToConsider: 60
        rule:
          type: and
          rules:
            - type: has_role
              roleId: 1240396803946582056 # Guest
            - type: post_days
              atLeast: 4
        welcomeMessageConfig:
          channel: 1223262623194153111 # community
          template: "Welcome to our community, USER_MENTION! :farmer:"
      # The user is an Active Member, and has made no posts or reactions in the last 30 days
      - daysToConsider: 30
        rule:
          type: and
          rules:
            - type: has_role
              roleId: 1223026651340996698 # Active Member
            - type: no_posts_or_reactions
      # The user has the "Inactive Member" role, and reacts with a 👍 in #quiet-garden
      - daysToConsider: 0 # no post or reaction history used, only current state
        rule:
          type: and
          rules:
            - type: has_role
              roleId: 1322321901586087976 # Inactive member
            - type: reacted
              emoji: "👍"
              messageId: 1322322546296885341 # message in quiet garden
        welcomeMessageConfig:
          channel: 1223262623194153111 # community
          template: "Welcome back, USER_MENTION! :slight_smile:"

  # Active Member
  - roleId: 1223026651340996698
    paths:
      # The user is a Member or an Active Member, and has posted on at least 8 days and 4 weeks in the last 60 days
      - daysToConsider: 60
        rule:
          type: and
          rules:
            - type: post_days
              atLeast: 8
            - type: post_weeks
              atLeast: 4
            - type: or
              rules:
              - type: has_role
                roleId: 1322322020284760196 # Member
              # Even if the user hasn't posted in the last 30 days, they should keep the Active Member role
              # if they still meet the "8 days and 4 weeks" rule. Otherwise, if we downgrade them, they could
              # be upgraded again on the next daily task.
              - type: has_role
                roleId: 1223026651340996698 # Active Member
        welcomeMessageConfig:
          channel: 1223262623194153111 # community
          template: "Thanks for your participation, USER_MENTION! You are now an active member :partying_face:"
      # Grace period: The user was an Active Member in the last 7 days, and has made a post in the last 7 days
      - daysToConsider: 7
        rule:
          type: and
          rules:
            - type: previously_had_role
              roleId: 1223026651340996698 # Active Member
            - type: post_days
              atLeast: 1



# The name to log when a user qualifies for no roles, and/or the roleConfig with roleId=null
noRoleName: "Visitor"



# Post this message when a member transitions to a membership role with a lower priority order than the role they had.
downgradeMessageConfig:
  channel: 1230667079213125702 # moderation-log
  template: "USERNAME has transitioned from PREVIOUS_ROLE to CURRENT_ROLE."



# The channel to log user activity in (e.g. posts & reactions)
persistenceConfig:
  channel: 1279607063646965921